services:
  db:
    image: postgres:alpine
    container_name: laEsquinaDelTrago-db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: laesquinadeltrago
      POSTGRES_PASSWORD: 0kigpPcMI5ULOb7wcCBRTukHmFOwO0kO
      POSTGRES_DB: laEsquinaDelTrago
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laEsquinaDelTrago-backend
    command: npm run start:dev
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laEsquinaDelTrago-frontend
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      
volumes:
  postgres_data: